name: "Build and publish devcontainer"

on:
  push:
    branches:
      - main
    paths:
      - gem.lock
      - docs/Gemfile.lock
      - src/jekyll-devcontainer/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: "Build and publish Jekyll devcontainer"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILD_TARGET: devcontainer
      DEVCONTAINER_IMAGE: ghcr.io/nhsdigital/nhs-notify-web-cms
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: "Set up Node.js"
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: "Log in to GitHub Container Registry"
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: "Build devcontainer image"
        run: |
          make build

      - name: "Publish devcontainer image"
        run: |
          make publish

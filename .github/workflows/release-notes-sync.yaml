name: "Release notes sync"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-release-notes:
    name: "Sync release notes"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Update release notes data"
        uses: ./.github/actions/release-notes
        env:
          JIRA_TOKEN: "${{ secrets.JIRA_TOKEN }}"
          JIRA_BASE_URL: "${{ secrets.JIRA_URL }}/rest/api/2"

      - name: "Detect release notes changes"
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- docs/_data/release-notes.json; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: "Configure GPG signing"
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GPG_PRIVATE_KEY: "${{ secrets.GPG_PRIVATE_KEY }}"
        shell: bash
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEY_ID=$(gpg --list-secret-keys --keyid-format LONG | awk '/^sec/{print $2}' | cut -d'/' -f2 | head -1)
          git config --global user.signingkey "$KEY_ID"
          git config --global commit.gpgsign true
          git config --global gpg.program gpg

      - name: "Create signed commit and pull request"
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        shell: bash
        run: |
          git checkout -B automation/release-notes-cache
          git add docs/_data/release-notes.json
          git commit -S -m "sync release notes"
          git push --force-with-lease origin automation/release-notes-cache
          gh pr create \
            --title "CCM-18043: Sync release notes" \
            --body "## Summary

          This PR syncs the release notes generated from JIRA for the last year.

          - Trigger: \`${{ github.event_name }}\`
          - Source: \`JIRA_URL secret (expanded to REST API base path)\`" \
            --base main \
            --head automation/release-notes-cache 2>/dev/null || echo "PR already exists"
